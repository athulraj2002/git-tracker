<div class="flex flex-col gap-1.5 relative">
  @if (label()) {
  <label
    [for]="id()"
    class="text-sm font-medium text-gray-700 dark:text-gray-300"
  >
    {{ label() }} @if (required()) {
    <span class="text-red-500">*</span>
    }
  </label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [value]="value()"
    [class]="inputClasses()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (displayError()) {
  <span class="text-xs text-red-500 absolute -bottom-5"
    >{{ displayError() }}</span
  >
  } @else if (hint()) {
  <span class="text-xs text-gray-400">{{ hint() }}</span>
  }
</div>
