<div
  class="flex items-center gap-0.5 bg-gray-900 border border-gray-800 rounded-lg p-0.5"
>
  @for (option of options(); track option.value) {
  <button
    type="button"
    class="px-2 py-1 rounded-md text-xs transition-colors cursor-pointer"
    [class.bg-gray-800]="value() === option.value"
    [class.text-white]="value() === option.value"
    [class.text-gray-500]="value() !== option.value"
    (click)="value.set(option.value)"
  >
    {{ option.label }}
  </button>
  }
</div>
