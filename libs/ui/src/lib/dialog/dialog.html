<!-- Click-outside-to-close on the backdrop; Escape (native, keyboard-operable) already closes the dialog, so this doesn't need its own keyboard equivalent. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialogEl
  [class]="panelClasses()"
  (click)="onDialogClick($event)"
  (close)="onNativeClose()"
>
  <div
    class="flex items-center justify-between gap-3 px-4 py-3 border-b border-gray-200 dark:border-gray-800"
  >
    <p class="text-sm font-medium text-gray-900 dark:text-white">{{ title() }}</p>
    <button
      type="button"
      class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors shrink-0 cursor-pointer"
      (click)="requestClose()"
      aria-label="Close"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        class="size-5"
      >
        <path
          d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
        />
      </svg>
    </button>
  </div>
  <div class="p-4">
    <ng-content></ng-content>
  </div>
</dialog>
