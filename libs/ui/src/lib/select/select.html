<div [class]="wrapperClasses()">
  <select [class]="selectClasses()" [disabled]="disabled()" (change)="onChange($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 size-4 text-gray-500"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</div>
