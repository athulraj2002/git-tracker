<div class="flex flex-col gap-1">
  <label
    [for]="id()"
    class="flex items-start gap-2.5 cursor-pointer"
    [class.opacity-50]="disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    <input
      type="checkbox"
      [id]="id()"
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="toggle($event)"
      class="mt-0.5 h-4 w-4 shrink-0 rounded border-gray-300 dark:border-gray-600 accent-black dark:accent-white
             focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-black dark:focus-visible:ring-white
             disabled:cursor-not-allowed"
    />
    @if (label()) {
      <span class="text-sm text-gray-700 dark:text-gray-300 select-none">{{ label() }}</span>
    }
  </label>
  @if (displayError()) {
    <span class="text-xs text-red-500 pl-6">{{ displayError() }}</span>
  } @else if (hint()) {
    <span class="text-xs text-gray-400 pl-6">{{ hint() }}</span>
  }
</div>
