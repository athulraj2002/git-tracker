<div
  class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-950 px-4"
>
  <div class="w-full max-w-sm flex flex-col items-center gap-4 text-center">
    @if (errorMessage()) {
      <p class="text-sm text-red-500">{{ errorMessage() }}</p>
      <a
        routerLink="/login"
        class="text-sm text-black dark:text-white font-medium hover:underline"
        >Back to sign in</a
      >
    } @else {
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Finishing GitHub sign-in…
      </p>
    }
  </div>
</div>
