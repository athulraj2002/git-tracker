<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-950 px-4">
  <div
    class="w-full max-w-sm flex flex-col gap-5 p-8 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900"
  >
    <div>
      <h1 class="text-xl font-semibold text-gray-900 dark:text-white">
        Sign in to Git Tracker
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Connect your Git provider to continue.
      </p>
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-500">{{ errorMessage() }}</p>
    }

    <lib-ui-button
      type="button"
      variant="outline"
      [isLoading]="loadingProvider() === 'github'"
      [disabled]="loadingProvider() !== null"
      (click)="continueWith('github')"
    >
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
             0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
             -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
             .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
             -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
             1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
             1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
             1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        ></path>
      </svg>
      Continue with GitHub
    </lib-ui-button>

    <lib-ui-button
      type="button"
      variant="outline"
      [isLoading]="loadingProvider() === 'gitlab'"
      [disabled]="loadingProvider() !== null"
      (click)="continueWith('gitlab')"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path
          d="M12 21.5 3.6 14.9 1.3 8.2c-.1-.4.3-.8.7-.6l5.4 3.9L12 3l4.6 8.5 5.4-3.9c.4-.2.8.2.7.6l-2.3 6.7z"
        ></path>
      </svg>
      Continue with GitLab
    </lib-ui-button>

    <lib-ui-button
      type="button"
      variant="outline"
      [isLoading]="loadingProvider() === 'bitbucket'"
      [disabled]="loadingProvider() !== null"
      (click)="continueWith('bitbucket')"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path
          d="M2.4 3.6a1.1 1.1 0 0 0-1.09 1.27l3.07 18.65c.1.6.62 1.04 1.23 1.04h12.8
             c.46 0 .85-.33.92-.79L22.7 4.87A1.1 1.1 0 0 0 21.6 3.6H2.4zM14.6 16.3H9.4
             l-1.4-7.3h8l-1.4 7.3z"
        ></path>
      </svg>
      Continue with Bitbucket
    </lib-ui-button>
  </div>
</div>
