<div
  class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-950 px-4 py-10"
>
  <form
    novalidate
    (submit)="onSubmit($event)"
    class="w-full max-w-sm flex flex-col gap-5 p-8 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900"
  >
    <div>
      <h1 class="text-xl font-semibold text-gray-900 dark:text-white">
        Create your account
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Start tracking your team's engineering metrics.
      </p>
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-500">{{ errorMessage() }}</p>
    }

    <lib-ui-input
      label="Full name"
      type="text"
      placeholder="Ada Lovelace"
      [formField]="signupForm.name"
    ></lib-ui-input>

    <lib-ui-input
      label="Email"
      type="email"
      placeholder="you@example.com"
      [formField]="signupForm.email"
    ></lib-ui-input>

    <lib-ui-input
      label="Password"
      type="password"
      placeholder="••••••••"
      hint="Must be at least 8 characters."
      [formField]="signupForm.password"
    ></lib-ui-input>

    <lib-ui-checkbox
      label="I agree to the Terms of Service and Privacy Policy"
      [formField]="signupForm.acceptTerms"
    ></lib-ui-checkbox>

    <lib-ui-button
      type="submit"
      variant="primary"
      [isLoading]="isSubmitting()"
      [disabled]="isSubmitting()"
    >
      Create account
    </lib-ui-button>

    <p class="text-sm text-center text-gray-500 dark:text-gray-400">
      Already have an account?
      <a
        routerLink="/login"
        class="text-black dark:text-white font-medium hover:underline"
        >Sign in</a
      >
    </p>
  </form>
</div>
