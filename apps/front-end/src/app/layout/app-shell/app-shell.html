<div class="min-h-screen flex bg-gray-950">
  <aside
    class="w-60 shrink-0 border-r border-gray-800 flex flex-col justify-between"
  >
    <div>
      <div class="px-5 py-5 border-b border-gray-800">
        <span class="text-sm font-semibold text-white tracking-tight"
          >Git Tracker</span
        >
      </div>

      <nav class="px-3 py-4 flex flex-col gap-1">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-gray-800 text-white"
          class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          Dashboard
        </a>

        <a
          routerLink="/repos"
          routerLinkActive="bg-gray-800 text-white"
          class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
          >
            <circle cx="6" cy="5" r="2.25" />
            <circle cx="6" cy="19" r="2.25" />
            <circle cx="18" cy="12" r="2.25" />
            <path d="M6 7.25V16.75" />
            <path d="M6 7.25c0 5 4 4.75 10 4.75" />
          </svg>
          Repositories
        </a>

        <a
          routerLink="/settings"
          routerLinkActive="bg-gray-800 text-white"
          class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />
          </svg>
          Settings
        </a>
      </nav>
    </div>

    <div class="px-3 py-4 border-t border-gray-800 flex flex-col gap-2">
      <div class="flex items-center gap-2.5 px-3 py-1.5">
        @if (authService.user()?.avatarUrl) {
          <img
            [src]="authService.user()?.avatarUrl"
            alt=""
            class="size-7 rounded-full shrink-0"
          />
        } @else {
          <div
            class="size-7 rounded-full bg-gray-800 shrink-0 flex items-center justify-center text-xs text-gray-400"
          >
            {{ (authService.user()?.name ?? '?').charAt(0) }}
          </div>
        }
        <div class="min-w-0">
          <p class="text-sm text-white truncate">
            {{ authService.user()?.name }}
          </p>
          <p class="text-xs text-gray-500 truncate">
            {{ authService.user()?.email }}
          </p>
        </div>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-400 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4 shrink-0"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="flex-1 min-w-0 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
